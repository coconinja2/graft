bus:
  port: 7433
  backend: memory          # memory | redis
  redis_url: redis://localhost:6379  # only if backend: redis

agents:
  heartbeat_interval: 30   # seconds between heartbeats
  claim_ttl: 120           # seconds before an abandoned claim auto-expires (override per claim via ttl param)

# Signal response strategies — agent decides by default.
# Receiving agents read the full broadcast context and choose how to respond
# based on what they are currently working on. Only configure forced strategies
# here for signals where agent discretion is not acceptable.
signal_responses:
  security_finding: escalate_to_human   # hard floor — never leave to agent judgment

# All other signal types (change_summary, interface_change, schema_change,
# resource_conflict, new_utility) are delivered as context. No forced strategy.
# Agents incorporate changes that affect their work and ignore those that don't.

pools:
  test_database:
    resources:
      - postgres://localhost:5432/test_1
      - postgres://localhost:5432/test_2
      - postgres://localhost:5432/test_3
  dev_port:
    resources: [3001, 3002, 3003, 3004]

waves:
  sprint_wave_1:
    agents: [agent-a, agent-b, agent-c, agent-d]
    merge_gate: all_complete    # all_complete | majority | any