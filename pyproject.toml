[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graft"
version = "1.0.0"
description = "Shared resource coordination layer for parallel AI coding agents"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["src/sdk/python"]